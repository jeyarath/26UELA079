<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#fff8f6;font-family:Arial,Helvetica,sans-serif}
main{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:0}
.page{position:relative;width:min(100vw, 100vh);max-width:100%;line-height:0}
.page img{display:block;width:100%;height:auto}
.hotspot{position:absolute;display:block;z-index:2;background:rgba(255,255,255,0);cursor:pointer}

.sixth{left:0;top:100%;width:100%;height:1px}
.place-link{position:fixed;right:12px;bottom:10px;padding:8px 12px;background:rgba(255,255,255,.94);border:1px solid #eed9e4;border-radius:20px;color:#5c3450;font-size:12px;line-height:1.3;text-decoration:none;box-shadow:0 2px 12px #00000010;z-index:6}
.hint{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);padding:7px 12px;background:rgba(255,255,255,.9);border:1px solid #eed9e4;border-radius:20px;color:#5c3450;font-size:12px;line-height:1.3;box-shadow:0 2px 12px #00000010;z-index:5;white-space:nowrap}
@media(max-width:520px){.hint{font-size:10px;bottom:5px}}
</style>
